name: reellink-dev

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: reellink-api-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/reellink
      JWT_ACCESS_SECRET: dev-access-secret-change-me-32-chars-min
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me-32-chars-min
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - bun_cache:/root/.bun
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: reellink-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reellink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reellink"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: reellink-adminer-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  backend_node_modules:
  bun_cache:
  postgres_data:
